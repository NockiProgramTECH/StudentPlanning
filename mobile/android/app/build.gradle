plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Codemagic injects these variables from its private Android signing identity.
// No credentials, keystore or generated signing properties are committed.
def ciKeystorePath = System.getenv("CM_KEYSTORE_PATH")
if (ciKeystorePath) {
    ["CM_KEYSTORE_PASSWORD", "CM_KEY_ALIAS", "CM_KEY_PASSWORD"].each { name ->
        if (!System.getenv(name)) {
            throw new GradleException("Missing Android signing variable: " + name)
        }
    }
}

android {
    namespace "com.studentplanning.studia"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId "com.studentplanning.studia"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    signingConfigs {
        if (ciKeystorePath) {
            release {
                storeFile file(ciKeystorePath)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Never fall back to a debug key for release artifacts.
            if (ciKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Without a private signing identity, local release builds remain unsigned.
    // The Codemagic beta workflow explicitly refuses to proceed in that case.
}
flutter { source "../.." }

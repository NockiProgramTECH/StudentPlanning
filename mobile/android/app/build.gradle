plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Codemagic injects these variables from its private Android signing identity.
// No credentials, keystore or generated signing properties are committed.
def ciKeystorePath = System.getenv("CM_KEYSTORE_PATH")
if (ciKeystorePath) {
    ["CM_KEYSTORE_PASSWORD", "CM_KEY_ALIAS", "CM_KEY_PASSWORD"].each { name ->
        if (!System.getenv(name)) {
            throw new GradleException("Missing Android signing variable: " + name)
        }
    }
}
def localSigningFile = rootProject.file("key.properties")
def localSigning = new Properties()
if (localSigningFile.isFile()) {
    localSigningFile.withInputStream { localSigning.load(it) }
}
def localKeystorePath = localSigning.getProperty("storeFile")
if (!ciKeystorePath && localKeystorePath &&
        ["storePassword", "keyAlias", "keyPassword"].any { !localSigning.getProperty(it) }) {
    throw new GradleException("Local release signing requires storePassword, keyPassword, keyAlias, and storeFile in android/key.properties.")
}

android {
    namespace "com.studentplanning.studia"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId "com.studentplanning.studia"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    signingConfigs {
        if (ciKeystorePath) {
            release {
                storeFile file(ciKeystorePath)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CM_KEY_ALIAS")
                keyPassword System.getenv("CM_KEY_PASSWORD")
            }
        } else if (localKeystorePath) {
            release {
                storeFile rootProject.file(localKeystorePath)
                storePassword localSigning.getProperty("storePassword")
                keyAlias localSigning.getProperty("keyAlias")
                keyPassword localSigning.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            // Never fall back to a debug key for release artifacts.
            if (ciKeystorePath) {
                signingConfig signingConfigs.release
            } else if (localKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
    // The Codemagic beta workflow explicitly requires its private signing identity.
}
flutter { source "../.." }
